<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%" fill="none">
  <!-- Background Glow & Card Base -->
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
    <linearGradient id="badge-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="badge-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="badge-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0f172a" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Ambient background elements -->
  <circle cx="120" cy="100" r="80" fill="#3b82f6" fill-opacity="0.08" />
  <circle cx="480" cy="380" r="100" fill="#6366f1" fill-opacity="0.08" />
  
  <!-- Main Code Editor Window -->
  <g filter="url(#card-shadow)">
    <!-- Window Frame -->
    <rect x="50" y="50" width="500" height="380" rx="16" fill="url(#bg-grad)" stroke="#334155" stroke-width="1.5" />
    
    <!-- Title Bar -->
    <rect x="50" y="50" width="500" height="42" rx="16" fill="#1e293b" />
    <path d="M50 76 h500 v16 H50 z" fill="#1e293b" />
    <line x1="50" y1="92" x2="550" y2="92" stroke="#334155" stroke-width="1" />
    
    <!-- Window Controls -->
    <circle cx="76" cy="71" r="6" fill="#ef4444" />
    <circle cx="96" cy="71" r="6" fill="#f59e0b" />
    <circle cx="116" cy="71" r="6" fill="#10b981" />
    
    <!-- File Tab -->
    <rect x="150" y="58" width="130" height="26" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <circle cx="166" cy="71" r="3" fill="#3b82f6" />
    <text x="178" y="75" fill="#94a3b8" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">Student.cpp</text>

    <!-- Line Numbers -->
    <text x="75" y="130" fill="#475569" font-family="'Consolas', monospace" font-size="13">01</text>
    <text x="75" y="160" fill="#475569" font-family="'Consolas', monospace" font-size="13">02</text>
    <text x="75" y="190" fill="#475569" font-family="'Consolas', monospace" font-size="13">03</text>
    <text x="75" y="220" fill="#475569" font-family="'Consolas', monospace" font-size="13">04</text>
    <text x="75" y="250" fill="#475569" font-family="'Consolas', monospace" font-size="13">05</text>
    <text x="75" y="280" fill="#475569" font-family="'Consolas', monospace" font-size="13">06</text>
    <text x="75" y="310" fill="#475569" font-family="'Consolas', monospace" font-size="13">07</text>
    <text x="75" y="340" fill="#475569" font-family="'Consolas', monospace" font-size="13">08</text>
    <text x="75" y="370" fill="#475569" font-family="'Consolas', monospace" font-size="13">09</text>
    <text x="75" y="400" fill="#475569" font-family="'Consolas', monospace" font-size="13">10</text>

    <!-- Code Content -->
    <text x="115" y="130" font-family="'Consolas', monospace" font-size="13">
      <tspan fill="#ec4899">#include</tspan> <tspan fill="#60a5fa">&lt;iostream&gt;</tspan>
    </text>
    
    <text x="115" y="160" font-family="'Consolas', monospace" font-size="13">
      <tspan fill="#818cf8">class</tspan> <tspan fill="#facc15">GareemaJoshi</tspan> <tspan fill="#e2e8f0">{</tspan>
    </text>
    
    <text x="115" y="190" font-family="'Consolas', monospace" font-size="13">
      <tspan fill="#94a3b8">  public:</tspan>
    </text>
    
    <text x="115" y="220" font-family="'Consolas', monospace" font-size="13">
      <tspan fill="#94a3b8">    std::string role = </tspan><tspan fill="#34d399">"B.Tech CSE Student"</tspan><tspan fill="#e2e8f0">;</tspan>
    </text>
    
    <text x="115" y="250" font-family="'Consolas', monospace" font-size="13">
      <tspan fill="#94a3b8">    std::string college = </tspan><tspan fill="#34d399">"LPU"</tspan><tspan fill="#e2e8f0">;</tspan>
    </text>
    
    <text x="115" y="280" font-family="'Consolas', monospace" font-size="13">
      <tspan fill="#818cf8">    void</tspan> <tspan fill="#60a5fa">learnAndBuild</tspan><tspan fill="#e2e8f0">() {</tspan>
    </text>
    
    <text x="115" y="310" font-family="'Consolas', monospace" font-size="13">
      <tspan fill="#94a3b8">      std::cout &lt;&lt; </tspan><tspan fill="#34d399">"Exploring CS &amp; Tech!"</tspan><tspan fill="#e2e8f0">;</tspan>
    </text>
    
    <text x="115" y="340" font-family="'Consolas', monospace" font-size="13">
      <tspan fill="#e2e8f0">    }</tspan>
    </text>
    
    <text x="115" y="370" font-family="'Consolas', monospace" font-size="13">
      <tspan fill="#e2e8f0">};</tspan>
    </text>
  </g>

  <!-- Floating Tech Floating Badge 1 - C++ -->
  <g filter="url(#card-shadow)">
    <rect x="420" y="110" width="130" height="48" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" />
    <circle cx="444" cy="134" r="14" fill="url(#badge-blue)" />
    <text x="444" y="139" text-anchor="middle" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">C++</text>
    <text x="468" y="131" fill="#f8fafc" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Core Lang</text>
    <text x="468" y="145" fill="#94a3b8" font-family="'Segoe UI', Roboto, sans-serif" font-size="10">Foundations</text>
  </g>

  <!-- Floating Tech Floating Badge 2 - Python -->
  <g filter="url(#card-shadow)">
    <rect x="25" y="300" width="135" height="48" rx="12" fill="#1e293b" stroke="#6366f1" stroke-width="1.5" />
    <circle cx="49" cy="324" r="14" fill="url(#badge-purple)" />
    <text x="49" y="329" text-anchor="middle" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700">Py</text>
    <text x="73" y="321" fill="#f8fafc" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Python</text>
    <text x="73" y="335" fill="#94a3b8" font-family="'Segoe UI', Roboto, sans-serif" font-size="10">Logic &amp; Scripts</text>
  </g>

  <!-- Floating Tech Floating Badge 3 - Web & DB -->
  <g filter="url(#card-shadow)">
    <rect x="390" y="360" width="170" height="48" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="1.5" />
    <circle cx="414" cy="384" r="14" fill="url(#badge-emerald)" />
    <text x="414" y="389" text-anchor="middle" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700">Web</text>
    <text x="438" y="381" fill="#f8fafc" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">HTML · CSS · JS</text>
    <text x="438" y="395" fill="#94a3b8" font-family="'Segoe UI', Roboto, sans-serif" font-size="10">Database (MySQL)</text>
  </g>
</svg>
