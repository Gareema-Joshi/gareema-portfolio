<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" fill="none">
  <!-- Background Plate -->
  <rect width="800" height="500" rx="4" fill="#F2EFE7" stroke="#17221D" stroke-width="2" />
  <rect x="20" y="20" width="760" height="460" fill="none" stroke="#B56A4A" stroke-width="1.5" stroke-dasharray="4 4" />

  <!-- Corner Ornamental Accent Marks -->
  <path d="M 35,55 L 35,35 L 55,35" stroke="#17221D" stroke-width="3" fill="none"/>
  <path d="M 765,55 L 765,35 L 745,35" stroke="#17221D" stroke-width="3" fill="none"/>
  <path d="M 35,445 L 35,465 L 55,465" stroke="#17221D" stroke-width="3" fill="none"/>
  <path d="M 765,445 L 765,465 L 745,465" stroke="#17221D" stroke-width="3" fill="none"/>

  <!-- Watermark Seal Graphic -->
  <circle cx="400" cy="220" r="70" fill="#17221D" opacity="0.04" />
  <circle cx="400" cy="220" r="60" fill="none" stroke="#B56A4A" stroke-width="1.5" stroke-dasharray="3 3" />
  <text x="400" y="226" text-anchor="middle" fill="#B56A4A" font-family="'JetBrains Mono', monospace" font-size="24" font-weight="800">GAREEMA</text>

  <!-- Instructional Text -->
  <text x="400" y="320" text-anchor="middle" fill="#17221D" font-family="'Playfair Display', serif" font-size="20" font-weight="700">CERTIFICATE IMAGE PLACEHOLDER</text>
  <text x="400" y="350" text-anchor="middle" fill="#7C897D" font-family="'JetBrains Mono', monospace" font-size="13">Replace image here: &lt;img src="certificate.jpg" alt="Certification name"&gt;</text>

  <!-- Bottom Details Bar -->
  <line x1="150" y1="400" x2="650" y2="400" stroke="#17221D" stroke-width="1" opacity="0.2" />
  <text x="400" y="425" text-anchor="middle" fill="#171817" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">OFFICIAL CREDENTIAL // LANDSCAPE ASPECT RATIO (800x500)</text>
</svg>
